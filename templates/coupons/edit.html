{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h1>Edit {{ coupon.code }}</h1>
    <form method="POST">
        <div class="grid">
            <div class="form-group">
                <label>Discount Value</label>
                <input name="discount_value" value="{{ coupon.discount_value }}" required>
            </div>
            <div class="form-group">
                <label>Usage Limit</label>
                <input name="usage_limit" value="{{ coupon.usage_limit }}" required>
            </div>
            <div class="form-group">
                <label>Valid Until</label>
                <input type="datetime-local" name="valid_until" value="{{ coupon.valid_until.strftime('%Y-%m-%dT%H:%M') if coupon.valid_until else '' }}">
            </div>
            <div class="form-group">
                <label>Active</label>
                <select name="is_active">
                    <option value="true" {% if coupon.is_active %}selected{% endif %}>Active</option>
                    <option value="false" {% if not coupon.is_active %}selected{% endif %}>Inactive</option>
                </select>
            </div>
        </div>
        <button class="btn">Update Coupon</button>
    </form>
</div>
{% endblock %}
