{% extends 'base.html' %}
{% block title %}Edit Coupon - {{ coupon.code }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px;">
        <div>
            <h1 style="margin: 0; font-size: 1.75rem; font-weight: 800;">Edit Coupon: {{ coupon.code }}</h1>
            <p class="muted" style="margin: 4px 0 0 0;">Update discount limits, expiry dates, and status</p>
        </div>
        <a class="btn secondary" href="{{ url_for('coupon.web_get_coupons') }}">← Back to Coupons</a>
    </div>

    <form method="POST">
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;">
            <div class="form-group">
                <label>Discount Value *</label>
                <input type="number" step="0.01" min="0" name="discount_value" value="{{ coupon.discount_value }}" required>
            </div>

            <div class="form-group">
                <label>Usage Limit *</label>
                <input type="number" min="1" name="usage_limit" value="{{ coupon.usage_limit }}" required>
            </div>

            <div class="form-group">
                <label>Valid Until</label>
                <input type="datetime-local" name="valid_until" value="{{ coupon.valid_until.strftime('%Y-%m-%dT%H:%M') if coupon.valid_until else '' }}">
            </div>

            <div class="form-group">
                <label>Coupon Status</label>
                <select name="is_active">
                    <option value="true" {% if coupon.is_active %}selected{% endif %}>Active</option>
                    <option value="false" {% if not coupon.is_active %}selected{% endif %}>Inactive</option>
                </select>
            </div>
        </div>

        <div style="display: flex; gap: 16px; justify-content: flex-end; margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
            <a class="btn secondary" href="{{ url_for('coupon.web_get_coupons') }}">Cancel</a>
            <button class="btn" type="submit" style="padding: 12px 32px; font-size: 1rem;">💾 Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
