{% extends 'base.html' %}
{% block title %}Create Coupon - TicketFlow{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px;">
        <div>
            <h1 style="margin: 0; font-size: 1.75rem; font-weight: 800;">Create Discount Coupon</h1>
            <p class="muted" style="margin: 4px 0 0 0;">Create a promotional discount code for ticket purchases</p>
        </div>
        <a class="btn secondary" href="{{ url_for('coupon.web_get_coupons') }}">← Back to Coupons</a>
    </div>

    <form method="POST">
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;">
            <div class="form-group">
                <label>Coupon Code *</label>
                <input type="text" name="code" required placeholder="e.g. SUMMER2026" style="text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">
            </div>

            <div class="form-group">
                <label>Discount Type *</label>
                <select name="discount_type" required>
                    <option value="PERCENTAGE">Percentage (%)</option>
                    <option value="FIXED">Fixed Amount (₹)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Discount Value *</label>
                <input type="number" step="0.01" min="0" name="discount_value" required placeholder="e.g. 15 or 100">
            </div>

            <div class="form-group">
                <label>Usage Limit *</label>
                <input type="number" min="1" name="usage_limit" required placeholder="e.g. 100 uses">
            </div>

            <div class="form-group">
                <label>Valid From</label>
                <input type="datetime-local" name="valid_from">
            </div>

            <div class="form-group">
                <label>Valid Until</label>
                <input type="datetime-local" name="valid_until">
            </div>
        </div>

        <div style="display: flex; gap: 16px; justify-content: flex-end; margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
            <a class="btn secondary" href="{{ url_for('coupon.web_get_coupons') }}">Cancel</a>
            <button class="btn" type="submit" style="padding: 12px 32px; font-size: 1rem;">🏷 Create Coupon</button>
        </div>
    </form>
</div>
{% endblock %}
