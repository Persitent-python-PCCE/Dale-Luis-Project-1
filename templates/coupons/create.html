{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h1>Create Coupon</h1>
    <form method="POST">
        <div class="grid"><div class="form-group">
            <label>Code</label><input name="code" required>
        </div>
        <div class="form-group">
            <label>Discount Type</label>
            <select name="discount_type">
                <option>PERCENTAGE</option><option>FIXED</option>
            </select>
        </div>
        <div class="form-group">
            <label>Discount Value</label><input type="number" step="0.01" name="discount_value">
        </div>
        <div class="form-group">
            <label>Usage Limit</label>
            <input type="number" name="usage_limit">
        </div>
        <div class="form-group">
            <label>Valid From</label>
            <input type="datetime-local" name="valid_from">
        </div>
        <div class="form-group">
            <label>Valid Until</label>
            <input type="datetime-local" name="valid_until">
        </div>
        </div>
        <button class="btn">Create Coupon</button>
    </form>
</div>
{% endblock %}
