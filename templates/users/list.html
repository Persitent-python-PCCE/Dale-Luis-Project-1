{% extends 'base.html' %}{% block content %}<h1>Users</h1><form class="searchbar"><input name="keyword" placeholder="Search users by name"><button class="btn">Search</button></form><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>{% for user in users %}<tr><td>{{ user.name }}</td><td>{{ user.email }}</td><td><span class="badge">{{ user.role }}</span></td><td>{{ 'Active' if user.is_active else 'Inactive' }}</td><td><a class="btn secondary" href="{{ url_for('user.web_user_details', user_id=user.id) }}">Details</a></td></tr>{% endfor %}</table>{% endblock %}
