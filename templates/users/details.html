{% extends 'base.html' %}{% block content %}<div class="card"><h1>{{ user.name }}</h1><p><b>Email:</b> {{ user.email }}</p><p><b>Phone:</b> {{ user.phone }}</p><p><b>Current Role:</b> {{ user.role }}</p><form method="POST" action="{{ url_for('user.web_change_role', user_id=user.id) }}"><div class="form-group"><label>Change Role</label><select name="role"><option>CUSTOMER</option><option>EVENT_MANAGER</option><option>ADMIN</option></select></div><button class="btn">Update Role</button></form><hr><form method="POST" action="{{ url_for('user.web_toggle_status', user_id=user.id) }}"><button class="btn danger">{{ 'Deactivate' if user.is_active else 'Activate' }} User</button></form></div>{% endblock %}
