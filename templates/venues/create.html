{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h1>Add Venue</h1>
    <form method="POST">
        <div class="grid">
            <div class="form-group">
                <label>Name</label>
                <input name="name">
            </div>
            <div class="form-group">
                <label>Location</label>
                <input name="location">
            </div>
            <div class="form-group">
                <label>Maximum Capacity</label>
                <input type="number" name="maximum_capacity">
            </div>
        </div>
        <div class="form-group">
            <label>Address</label>
            <textarea name="address"></textarea>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description"></textarea>
        </div>
        <button class="btn">Create Venue</button>
    </form>
</div>
{% endblock %}
