{% extends 'base.html' %}
{% block title %}Edit User - {{ user.name }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px;">
        <div>
            <h1 style="margin: 0; font-size: 1.75rem; font-weight: 800;">Edit User Account</h1>
            <p class="muted" style="margin: 4px 0 0 0;">Update user details and access privileges</p>
        </div>
        <a class="btn secondary" href="{{ url_for('user.web_get_users') }}">← Back to Users</a>
    </div>

    <form method="POST">
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="name" value="{{ user.name }}" required>
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone" value="{{ user.phone or '' }}" placeholder="10-digit phone number" pattern="[0-9]{10}" maxlength="10">
            </div>

            <div class="form-group">
                <label>Account Role *</label>
                <select name="role">
                    {% for role in ['CUSTOMER', 'EVENT_MANAGER', 'ADMIN'] %}
                    <option value="{{ role }}" {% if user.role == role %}selected{% endif %}>{{ role }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div style="display: flex; gap: 16px; justify-content: flex-end; margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
            <a class="btn secondary" href="{{ url_for('user.web_get_users') }}">Cancel</a>
            <button class="btn" type="submit" style="padding: 12px 32px; font-size: 1rem;">💾 Save User Changes</button>
        </div>
    </form>
</div>
{% endblock %}
