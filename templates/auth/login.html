{% extends 'base.html' %}
{% block title %}Login - TicketFlow{% endblock %}

{% block content %}
<div class="card auth-card">
    <div style="text-align: center; margin-bottom: 24px;">
        <div class="brand-icon" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto 12px auto;">🎟</div>
        <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 6px;">Welcome Back</h1>
        <p class="muted" style="margin: 0;">Sign in to discover and book your favourite events</p>
    </div>

    <form method="POST">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required placeholder="you@example.com" autofocus>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">
        </div>

        <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0; font-weight: 500;">
                <input type="checkbox" name="remember_me" style="width: 18px; height: 18px; accent-color: var(--primary);">
                <span>Remember me</span>
            </label>
        </div>

        <button class="btn" type="submit" style="width: 100%; padding: 12px; font-size: 1rem; margin-top: 8px;">
            🔐 Sign In
        </button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid #e2e8f0;">
        <p class="muted" style="margin: 0; font-size: 0.9rem;">
            Don't have an account yet? 
            <a href="{{ url_for('auth.web_register') }}" style="color: var(--primary); font-weight: 700;">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
