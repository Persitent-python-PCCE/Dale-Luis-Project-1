{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h1>My Profile</h1>
    <div class="detail-grid">
        <div>
            <p><b>Name:</b> {{ user.name }}</p>
            <p><b>Email:</b> {{ user.email }}</p>
            <p><b>Phone:</b> {{ user.phone or '-' }}</p>
            <p><b>Role:</b> <span class="badge">{{ user.role }}</span></p>
        </div>
        <div>
            <h3>Account status</h3>
            <p class="muted">Manage your personal information and booking activity.</p>
            <a class="btn secondary" href="{{ url_for('booking.web_my_bookings') }}">View Bookings</a>
        </div>
    </div>
</div>
{% endblock %}
