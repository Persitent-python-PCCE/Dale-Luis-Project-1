{% extends 'base.html' %}
{% block title %}Create Account - TicketFlow{% endblock %}

{% block content %}
<div class="card auth-card">
    <div style="text-align: center; margin-bottom: 24px;">
        <div class="brand-icon" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto 12px auto;">✨</div>
        <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 6px;">Create Account</h1>
        <p class="muted" style="margin: 0;">Join TicketFlow to book tickets and manage events</p>
    </div>

    <form method="POST">
        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="name" required placeholder="John Doe">
        </div>

        <div class="form-group">
            <label>Email Address *</label>
            <input type="email" name="email" required placeholder="you@example.com">
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="10-digit phone number (e.g. 9876543210)" pattern="[0-9]{10}" maxlength="10">
        </div>

        <div class="form-group">
            <label>Account Type *</label>
            <select name="role" required>
                <option value="CUSTOMER" selected>Customer (Book Event Tickets)</option>
                <option value="EVENT_MANAGER">Event Manager (Host & Manage Events)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Password *</label>
            <input type="password" name="password" required placeholder="Create a strong password">
        </div>

        <button class="btn" type="submit" style="width: 100%; padding: 12px; font-size: 1rem; margin-top: 8px;">
            ✨ Create Account
        </button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid #e2e8f0;">
        <p class="muted" style="margin: 0; font-size: 0.9rem;">
            Already registered? 
            <a href="{{ url_for('auth.web_login') }}" style="color: var(--primary); font-weight: 700;">Sign in here</a>
        </p>
    </div>
</div>
{% endblock %}
