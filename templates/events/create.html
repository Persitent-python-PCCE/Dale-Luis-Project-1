{% extends 'base.html' %}
{% block content %}
    <div class="card"><h1>Create Event</h1><form method="POST" enctype="multipart/form-data"><div class="grid">
        <div class="form-group">
            <label>Event name</label>
            <input name="name" required>
        </div>
        <div class="form-group">
            <label>Category</label>
            <select name="category_id" required>
                {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Venue</label>
            <select name="venue_id" required>
                {% for venue in venues %}
                <option value="{{ venue.id }}">{{ venue.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Maximum capacity</label>
            <input type="number" name="maximum_capacity" min="1" required>
        </div>
        <div class="form-group">
            <label>Event poster</label>
            <input type="file" name="poster" accept="image/png,image/jpeg,image/webp,image/gif">
        </div>
        <div class="form-group">
            <label>Start date</label>
            <input type="date" name="start_date" required>
        </div>
        <div class="form-group">
            <label>End date</label>
            <input type="date" name="end_date" required>
        </div>
        <div class="form-group">
            <label>Start time</label>
            <input type="time" name="start_time" required>
        </div>
        <div class="form-group">
            <label>End time</label>
            <input type="time" name="end_time" required>
        </div>
        <div class="form-group">
            <label>VIP price</label>
            <input type="number" step="0.01" name="vip_price" min="0" required>
        </div>
        <div class="form-group">
            <label>Premium price</label>
            <input type="number" step="0.01" name="premium_price" min="0" required>
        </div>
        <div class="form-group">
            <label>Regular price</label>
            <input type="number" step="0.01" name="regular_price" min="0" required>
        </div>
    </div><div class="form-group">
        <label>Description</label>
        <textarea name="description" required></textarea>
    </div><button class="btn">Submit for Approval</button>
</form>
</div>
{% endblock %}
