{% extends 'base.html' %}
{% block title %}Create Event - TicketFlow{% endblock %}

{% block content %}
<div class="card" style="max-width: 900px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px;">
        <div>
            <h1 style="margin: 0; font-size: 1.75rem; font-weight: 800;">Create New Event</h1>
            <p class="muted" style="margin: 4px 0 0 0;">Fill in the details below to submit your event for administrator approval</p>
        </div>
        <a class="btn secondary" href="{{ url_for('event.web_get_events') }}">← Back to Events</a>
    </div>

    <form method="POST" enctype="multipart/form-data">
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px;">
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Event Name *</label>
                <input type="text" name="name" required placeholder="e.g. Grand Music Festival 2026">
            </div>

            <div class="form-group">
                <label>Category *</label>
                <select name="category_id" required>
                    <option value="" disabled selected>Select Category</option>
                    {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Venue *</label>
                <select name="venue_id" required>
                    <option value="" disabled selected>Select Venue</option>
                    {% for venue in venues %}
                    <option value="{{ venue.id }}">{{ venue.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Maximum Capacity *</label>
                <input type="number" name="maximum_capacity" min="1" required placeholder="e.g. 100">
            </div>

            <div class="form-group">
                <label>Start Date *</label>
                <input type="date" name="start_date" required>
            </div>

            <div class="form-group">
                <label>End Date *</label>
                <input type="date" name="end_date" required>
            </div>

            <div class="form-group">
                <label>Start Time *</label>
                <input type="time" name="start_time" required>
            </div>

            <div class="form-group">
                <label>End Time *</label>
                <input type="time" name="end_time" required>
            </div>

            <div class="form-group">
                <label>VIP Ticket Price (₹) *</label>
                <input type="number" step="0.01" min="0" name="vip_price" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label>Premium Ticket Price (₹) *</label>
                <input type="number" step="0.01" min="0" name="premium_price" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label>Regular Ticket Price (₹) *</label>
                <input type="number" step="0.01" min="0" name="regular_price" required placeholder="0.00">
            </div>

            <div class="form-group" style="grid-column: 1 / -1; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 18px;">
                <label style="font-size: 1rem; font-weight: 700; margin-bottom: 6px;">Event Poster Image</label>
                <input type="file" name="poster" accept="image/png,image/jpeg,image/webp,image/gif">
                <small class="muted" style="display: block; margin-top: 6px;">Upload a high-quality poster image (PNG, JPG, WEBP, or GIF).</small>
            </div>

            <div class="form-group" style="grid-column: 1 / -1; background: #fffbebf5; border: 1.5px solid #f59e0b; border-radius: 12px; padding: 16px;">
                <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; margin: 0;">
                    <input type="checkbox" name="is_18_plus" value="true" style="width: 20px; height: 20px; accent-color: #ef4444;">
                    <div>
                        <strong style="color: #92400e; font-size: 1rem;">🔞 18+ Age Restricted Event</strong>
                        <div class="muted" style="font-size: 0.85rem; font-weight: 400; color: #78350f;">
                            Requires customers to upload identification documents (ID/Passport) during ticket booking.
                        </div>
                    </div>
                </label>
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Event Description *</label>
                <textarea name="description" required placeholder="Provide a detailed description of the event..."></textarea>
            </div>
        </div>

        <div style="display: flex; gap: 16px; justify-content: flex-end; margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
            <a class="btn secondary" href="{{ url_for('event.web_get_events') }}">Cancel</a>
            <button class="btn" type="submit" style="padding: 12px 32px; font-size: 1rem;">🚀 Submit for Approval</button>
        </div>
    </form>
</div>
{% endblock %}
